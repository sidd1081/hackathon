server {
    listen 80;
    server_name _;

    # Proxy API calls to the backend service (same-origin -> no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RCA generation can take ~25s+ (Groq); allow long upstream responses.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Dataset uploads can be large.
        client_max_body_size 60m;
    }

    # Serve the SPA; fall back to index.html for client-side routing.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
